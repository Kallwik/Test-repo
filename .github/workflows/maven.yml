name: AI Fix Trigger

on:
  workflow_run:
    workflows: ["Maven CI"]
    types:
      - completed
    branches:
      - Dev

permissions:
  contents: write
  id-token: write

jobs:
  extract-error:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      error_logs: ${{ steps.capture.outputs.error }}
    steps:
      - name: Download logs
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e
          RUN_ID=${{ github.event.workflow_run.id }}
          REPO=${{ github.event.workflow_run.repository.full_name }}
          curl --http1.1 -L --retry 3 \
            -H "Authorization: Bearer $PAT_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/logs" \
            -o logs.zip

      - name: Extract logs
        run: unzip -q logs.zip -d logs || true

      - name: Extract error
        id: capture
        run: |
          ERROR=$(find logs -name "*.txt" -exec grep -Ei "error|exception|failed|maven.yml" {} + | tail -n 200 || true)
          echo "error<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ERROR" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  ai-fix:
    needs: extract-error
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run AI CI Fix
        uses: Shivam-singh2207/Ancyrus@v.1
        with:
          error_log: ${{ needs.extract-error.outputs.error_logs }}
          branch_name: Dev
          ci_file_name: maven.yml
          repo_full_name: ${{ github.repository }}
          gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          pat_token: ${{ secrets.PAT_TOKEN }}
          auto_push: 'true'
