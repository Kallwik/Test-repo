name: Maven CI

on:   
  push:
  pull_request:   
        
jobs:          
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:  
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn clean test

      - name: AI Code Review Action
        uses: villesau/ai-codereviewer@v2.7.0  
