name: Log GitHub Actions to Google Sheets
 
on:
  workflow_dispatch:

jobs:
  log-to-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Send Test Data to Google Sheets
        run: |
          curl -L -X POST "${{ secrets.GOOGLE_SHEET_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "issueId": "12345",
              "status": "Open",
              "failureCategory": "npm",
              "shortMessage": "npm install failed",
              "errorDescription": "Cannot find package.json",
              "recommendedFix": "Run npm install before npm test",
              "workflowName": "CI",
              "branch": "master",
              "failedStage": "Build",
              "buildUrl": "https://github.com/test-org/test-repo/actions/runs/123456789",
              "createdTime": "2026-07-15 21:40:00 UTC",
              "run": "Fail"
            }'

      - name: Finished
        run: echo "✅ Test data sent successfully."
