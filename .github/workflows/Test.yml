name: Log GitHub Actions to Google Sheets

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  log-to-sheet:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate Timestamp
        run: |
          echo "DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_ENV

      - name: Determine Workflow Status
        if: always()
        run: |
          echo "STATUS=${{ job.status }}" >> $GITHUB_ENV

      - name: Send Data to Google Sheets
        if: always()
        run: |
          curl -L -X POST "${{ secrets.GOOGLE_SHEET_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "workflow":"${{ github.workflow }}",
              "repository":"${{ github.repository }}",
              "branch":"${{ github.ref_name }}",
              "status":"${{ env.STATUS }}",
              "date":"${{ env.DATE }}",
              "commit":"${{ github.sha }}",
              "actor":"${{ github.actor }}",
              "run":"${{ github.run_number }}"
            }'

      - name: Done
        if: always()
        run: echo "Logged to Google Sheets ✅"
