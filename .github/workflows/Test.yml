name: Update Excel

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  update-excel:
    runs-on: ubuntu-latest

    env:
      TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      USER_ID: ${{ secrets.MS_USER_ID }}
      FILE_ID: ${{ secrets.MS_FILE_ID }}
      TABLE_NAME: Table1

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Microsoft Graph Token
        id: auth
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$CLIENT_ID" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Current Date
        run: |
          echo "DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_ENV

      - name: Append Row
        run: |
          curl -X POST \
            "https://graph.microsoft.com/v1.0/users/$USER_ID/drive/items/$FILE_ID/workbook/tables/$TABLE_NAME/rows/add" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"values\": [[
                \"${{ github.workflow }}\",
                \"${{ github.repository }}\",
                \"${{ github.ref_name }}\",
                \"${{ job.status }}\",
                \"$DATE\",
                \"${{ github.sha }}\",
                \"${{ github.actor }}\",
                \"${{ github.run_number }}\"
              ]]
            }"

      - name: Done
        run: echo "Excel updated"
